meters:
- name: base_monthly_service_cost
  description: Base monthly cost of a contracted waste/recycling service, surfaced read-only via the Services and Service Pricing resources - not a cost of the API itself.
  unit: USD
  aggregation: sum
  dimensions:
  - account
  - service
- name: disposal_rate_charges
  description: Disposal rate type/amount line items surfaced via Service Pricing and Invoice Fees.
  unit: USD
  aggregation: sum
  dimensions:
  - account
  - service
- name: invoice_balance
  description: Aging balance due (Current/30/60/90/120-day/Future) surfaced via the Balance resource.
  unit: USD
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Use the Invoices & Balance and Service Pricing resources to pull contracted cost and aging balance data into your own cost dashboards instead of manually checking the WM portal.
- name: Allocation
  description: Map WM customerId accounts to internal cost centers/sites so hauling spend rolls up correctly across a multi-location commercial account.
- name: Optimization
  description: Use Services and Service Operations data (materials, equipment, routing) to spot oversized containers, redundant pickups, or misrouted service lines that inflate the underlying contract cost.
- name: Accountability
  description: Assign an owner for the apiaccess@wm.com-issued ClientId/JWT credential and for reconciling API-sourced balance data against actual WM invoices.
