description: >-
  There is no separate FinOps surface for the WM Customer API - WM does not
  meter or invoice API calls. The API is a free data-access convenience
  layered on top of an existing commercial waste, recycling, or disposal
  service contract; the real spend that matters to a WM customer is the
  underlying hauling/disposal contract itself (base monthly service cost,
  disposal rate surcharges, and invoice fees - all of which the API surfaces
  as read data via the Services, Service Pricing, and Invoices & Balance
  resources) rather than any usage-based charge for calling the API.
notes: >-
  No FOCUS-aligned billing meters exist for the API. The FinOps-relevant
  data here is what the API exposes about the underlying contract (pricing,
  invoices, balance) rather than a cost of consuming the API.
