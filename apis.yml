aid: wm
url: https://raw.githubusercontent.com/api-evangelist/wm/refs/heads/main/apis.yml
name: WM
kind: company
description: WM (formerly Waste Management, Inc.) is North America's largest
  integrated environmental solutions company, serving nearly 20 million
  municipal, commercial, industrial, and residential customers through
  collection, transfer, recycling, landfill, and waste-to-energy operations.
  WM does not run a self-serve, publicly-signup developer platform. It
  publishes a documented partner/customer REST API at api.wm.com covering
  account-level service and billing data - service details and pickup
  schedules, live service status and truck ETA, routing and hauling material
  information, pricing, invoices and aging balance, communication
  preferences, contacts, cases, tickets, and account activity notes. Access
  requires a WM-issued ClientId plus a JSON Web Token (JWT) and is granted on
  request to existing commercial/enterprise customers and integration
  partners by emailing apiaccess@wm.com; there is no open, self-serve API key
  signup.
